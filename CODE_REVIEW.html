<script>
const DATA = [{"id": "PCN-001", "title": "Non-atomic client-side booking saga permanently blocks slots on interruption", "severity": "Critical", "category": "Backend", "type": "Issue", "sources": "BE-1, ARCH-2", "location": "`src/services/googleCalendar.ts:280-429` (transaction check :315-317, pending write :328, Google event :374-421, confirm :425-429, requestId :250)", "description": "Booking runs as a client-executed three-step saga: (1) a Firestore transaction writes a `pending` booking plus a `clientBookingCache` lock, (2) the browser calls the Google Calendar API, (3) a final `updateDoc` sets status `confirmed`. Verified in code: if the tab closes, the network drops, or any rollback `updateDoc`/`deleteDoc` itself fails between steps, the `pending` booking is left in place forever. The transaction's conflict check (`googleCalendar.ts:315`) treats any non-`cancelled` booking — including an orphaned `pending` — as taken, so the slot is permanently blocked for that coach with no reaper, no TTL on booking documents, and no UI surface that shows pending bookings (only `confirmed` bookings are listed). A Google Calendar event created in step 2 is orphaned if step 3 fails. The Meet `requestId` is regenerated randomly per call (`:250`), so retries are not idempotent. This is the direct consequence of having no trusted server-side component (see PCN-035).", "recommendation": "Move booking orchestration into a callable Cloud Function that creates the calendar event and confirms the booking atomically from the server's perspective. Short of that: add a TTL/`expireAt` on `pending` bookings and treat expired pendings as free in the transaction check; make the transaction retry path reuse a deterministic `requestId` (e.g. derived from `bookingId`); add a scheduled reaper (or lazy cleanup on read) that cancels stale pendings and deletes orphaned Google events.", "issue": 116, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/116", "skipped": false}, {"id": "PCN-002", "title": "Any signed-in user can overwrite any coach's availableSlotsCache", "severity": "High", "category": "Security", "type": "Vulnerability", "sources": "SEC-1", "location": "`firestore.rules:274-281`", "description": "Verified. The write rule is:\n```\nallow write: if (isSignedIn() && isValidAvailableSlotsCache(request.resource.data))\n  || (isOwner(uid) && isValidAvailableSlotsCache(...))\n  || (isAdmin() && isValidAvailableSlotsCache(...));\n```\nThe first disjunct makes the `isOwner`/`isAdmin` disjuncts dead code: any signed-in user (self-signup is open) who submits a shape-valid document can overwrite any coach's cache — despite the comment on lines 275-277 stating \"only the OWNER may write their own cache.\" `isValidAvailableSlotsCache` (rules :136-149) does not tie `data.userId` to `request.auth.uid` either. An attacker can zero out competitors' availability (denial of discovery), fabricate availability, or poison the faceted filter fields (`gender`, `country`, `icf_*`) that discovery filters on (`firebaseService.ts:808-819`).", "recommendation": "Replace the rule with `allow write: if (isOwner(uid) || isAdmin()) && isValidAvailableSlotsCache(request.resource.data) && request.resource.data.userId == uid;`. Deploy immediately; this is a one-line fix.", "issue": 117, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/117", "skipped": false}, {"id": "PCN-003", "title": "Users can self-assign verified ICF credentials via direct profile update", "severity": "High", "category": "Security", "type": "Vulnerability", "sources": "SEC-2", "location": "`firestore.rules:186-206` (`selfUpdateAllowed` :186-191, `isValidUserDoc` :59-81)", "description": "Verified. `selfUpdateAllowed()` pins only `userRole`, `userStatus`, `userId`, `email`, and `createdAt`. The credential fields `icf_acc`/`icf_pcc`/`icf_mcc`/`icf_actc`, `icfCredentials`, and `qualifications` are not pinned, and `isValidUserDoc` only type-checks them (bool/list). The client code path (`updateOwnProfile`, `firebaseService.ts:351-368`) excludes these fields, but rules are the security boundary: any user can call `updateDoc` directly against their own `users/{uid}` doc and set `icf_mcc: true` or fabricate `icfCredentials`, bypassing the admin verification flow (`updateVerifiedCredentials`). These flags feed both the profile display and the discovery facet filters, so users can advertise credentials they do not hold.", "recommendation": "Extend `selfUpdateAllowed()` to require `icf_acc`, `icf_pcc`, `icf_mcc`, `icf_actc`, `icfCredentials`, and `qualifications` to be unchanged (`request.resource.data.get(f, null) == resource.data.get(f, null)`), leaving admin updates unrestricted.", "issue": 118, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/118", "skipped": false}, {"id": "PCN-004", "title": "Rules 200-slot cap silently rejects availability cache writes for available coaches", "severity": "High", "category": "Backend", "type": "Issue", "sources": "BE-2", "location": "`firestore.rules:141`; `src/services/firebaseService.ts:532-587` (generation), `:345,367,490` (swallowed errors); `src/config/constants.ts:5`", "description": "Verified. `isValidAvailableSlotsCache` requires `data.availableSlots.size() <= 200`, but the client generates one slot per hour per configured range across `BOOKING_HORIZON_DAYS = 30`. A coach available 8 hours/day, 7 days/week generates 240 slots; broader availability generates far more. For such coaches every cache `setDoc` is denied by rules. All three trigger call sites swallow the rejection with `.catch(console.error)` (`firebaseService.ts:345,367,490`), so the coach sees a successful save while their public availability is frozen at the last successful write (or empty). The most-available coaches — exactly the ones the platform wants discoverable — are the ones hit.", "recommendation": "Align the two constants: either raise the rules cap to `BOOKING_HORIZON_DAYS * 24` (720) plus headroom, or cap generation client-side to match the rule. Surface cache-write failures to the user (and telemetry) instead of `console.error`, and add a rules-emulator test that writes a maximal realistic schedule.", "issue": 119, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/119", "skipped": false}, {"id": "PCN-005", "title": "Exact ISO slot matching breaks across fractional-offset timezones", "severity": "High", "category": "Backend", "type": "Issue", "sources": "BE-3", "location": "`src/services/firebaseService.ts:559-561` (coach slot generation), `:872-878` (`coachSlots.includes(slotIso)`); `src/components/UpcomingSessions.tsx:188-198` (viewer slot generation)", "description": "Verified. Coach cache slots are anchored to the coach's local wall-clock hours converted to UTC (`getUtcForLocalDateTime(..., hour, parsedStart.minute, timezone)`), so a coach in Asia/Kolkata (UTC+5:30) with a 9:00 start produces slots at `03:30:00.000Z`, `04:30Z`, etc. The viewer's discovery grid generates whole hours in the viewer's timezone (`getUtcForSlot(activeDayDate, hour, viewerTimezone)`), producing `:00Z` instants for whole-hour timezones. Matching is exact string equality (`coachSlots.includes(slotIso)`, `firebaseService.ts:878`), so a fractional-offset coach and a whole-hour viewer (or vice versa) can never match — the coach is invisible. The deploy region is asia-south1 (India, UTC+5:30), making this a mainline failure, not an edge case.", "recommendation": "Normalize slot boundaries to a global grid (e.g. UTC whole hours) at generation time, or match by time-range overlap rather than exact instant equality. Add unit tests pairing Asia/Kolkata, Asia/Kathmandu (+5:45), and UTC viewers/coaches.", "issue": 120, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/120", "skipped": false}, {"id": "PCN-006", "title": "Deactivated/inactive users remain discoverable and bookable", "severity": "High", "category": "Backend", "type": "Issue", "sources": "BE-4", "location": "`src/services/firebaseService.ts:772-888` (`queryAvailableCoachesForDay`; profile filter :861-868)", "description": "Verified. The discovery query filters the cache only by `availableDatesUtc` and in-memory facets; the candidate-profile pass keeps every profile where `userRole === 'user'` (`:864`) and never checks `userStatus`. The cache document even stores `userStatus` (`:586`) but it is never consulted, and nothing removes or empties a cache document on deactivation. A user the admin deactivates (or who was never approved but has a stale cache doc) stays discoverable and bookable, bypassing the approval workflow that the rest of the app (and the rules' `isAdmin` gate) treats as central.", "recommendation": "Filter on `userStatus === 'active'` in both the cache query (`where('userStatus','==','active')`) and the profile pass; on admin deactivation, delete or empty the user's `availableSlotsCache` doc (already triggered via `updateProfile` → recalc, but recalc must then write `availableSlots: []` for inactive users).", "issue": 121, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/121", "skipped": false}, {"id": "PCN-007", "title": "Availability cache goes stale for idle coaches; no scheduled refresh; credential updates skip recalc", "severity": "High", "category": "Architecture", "type": "Issue", "sources": "ARCH-1, BE-5", "location": "`src/services/firebaseService.ts:500-606` (recalc), triggers only at `:345,367,490`; `updateVerifiedCredentials` `:447-459` (no recalc); `firestore.rules:274-281` comment", "description": "Verified. `availableSlotsCache` holds a sliding 30-day window of slots, but it is recomputed only when the owner writes their profile or schedule. A coach who sets availability once and stops logging in has a window that shrinks daily and reaches zero within 30 days — silently undiscoverable despite an active schedule. There are no Cloud Functions or scheduled jobs to refresh caches (the rules comment at :18-22 acknowledges the missing backend). Additionally verified: `updateVerifiedCredentials` (`:447-459`) writes `icf_*` flags straight to the profile without triggering `recalculateAvailableSlotsCache`, so the credential facets denormalized into the cache (`:582-585`) go stale until an unrelated profile/schedule write occurs — admin-verified credentials do not show up in discovery filters.", "recommendation": "Add a scheduled Cloud Function that recomputes all caches daily (or recompute a coach's cache lazily on read when `lastUpdated` is older than 24h). Add the missing recalc call to `updateVerifiedCredentials` as an immediate fix.", "issue": 122, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/122", "skipped": false}, {"id": "PCN-008", "title": "Google OAuth token lost on reload; calendar operations (incl. cancel) fail until re-login", "severity": "High", "category": "Backend", "type": "Issue", "sources": "BE-6", "location": "`src/services/googleToken.ts:1-20`; `src/services/firebaseService.ts:208-214,307-316`; `src/services/googleCalendar.ts:365-372,460-465`", "description": "Verified. The Google access token is captured only from the redirect sign-in result and held in memory (deliberately, for XSS safety — see Positive observations). It expires after ~1 hour and is lost on any reload, while the Firebase Auth session persists. Result: a routinely signed-in user hits `GOOGLE_TOKEN_EXPIRED` on every booking attempt and — worse — `cancelBooking` refuses to proceed at all without a token (`googleCalendar.ts:461-465`), even though Firestore is the booking source of truth and the Google event delete tolerates 404. Users cannot cancel their own sessions without signing out and back in.", "recommendation": "Silently re-acquire the token when needed (e.g. `signInWithPopup`/token client with `prompt=none` on `GOOGLE_TOKEN_EXPIRED`), and decouple cancellation: cancel in Firestore first, then best-effort delete the Google event (queueing/flagging the orphan for cleanup if the token is absent).", "issue": 110, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/110", "skipped": true}, {"id": "PCN-009", "title": "Production build silently falls back to development database ID", "severity": "High", "category": "Architecture", "type": "Issue", "sources": "ARCH-8", "location": "`vite.config.ts:7-12`", "description": "Verified. When `VITE_FIRESTORE_DATABASE_ID` is unset in a production build, the config loads the development env file and uses its database ID (`loadEnv('development', ...)` at :10-11) instead of failing. The throw at :14-18 is unreachable for production whenever `.env.development` exists (it is committed — see PCN-040). A misconfigured prod build therefore ships pointing at the `pcn-dev` database with no error at build or run time.", "recommendation": "Delete the fallback block; in `mode === 'production'`, missing `VITE_FIRESTORE_DATABASE_ID` must throw.", "issue": 123, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/123", "skipped": false}, {"id": "PCN-010", "title": "Side effects inside setState updaters double-fire under StrictMode", "severity": "High", "category": "Frontend", "type": "Issue", "sources": "FE-2", "location": "`src/context/UnsavedChangesContext.tsx:61-66,76-81`; StrictMode enabled in `src/main.tsx`", "description": "Verified. Both `handleConfirm` and `handleDiscard` call `prev.navigateAction()` inside the `setModalState` updater function. React updaters must be pure; under `<StrictMode>` (enabled) React invokes updaters twice in development, double-firing navigation, and in general React is free to re-invoke updaters. Navigation here mutates history/URL state, so double invocation causes duplicated pushState/popstate dispatches.", "recommendation": "Capture `modalState.navigateAction` outside the updater, call `setModalState({...isOpen:false})` purely, then invoke the action (or via `useEffect` keyed on a \"pendingNavigation\" state).", "issue": 124, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/124", "skipped": false}, {"id": "PCN-011", "title": "Unsaved-changes guard bypassed by profile navigation and page unload", "severity": "High", "category": "Frontend", "type": "Issue", "sources": "FE-3", "location": "`src/utils/url.ts:38-43` (`navigateToProfile`); `src/components/ProfileEdit.tsx:224`; `src/components/UpcomingSessions.tsx:948,954`; no `beforeunload` handler anywhere", "description": "Verified. The dirty-state guard is enforced only through `navigateWithConfirmation` in tab navigation. `navigateToProfile` pushes URL state and dispatches `popstate` directly, unmounting the editing view without any confirmation; it is called from ProfileEdit and UpcomingSessions. There is also no `beforeunload` listener, so closing the tab or reloading with unsaved edits loses data silently. The guard exists but is trivially bypassed by the app's own code paths.", "recommendation": "Route profile navigation through `navigateWithConfirmation`, and register a `beforeunload` handler while `isDirty` is true.", "issue": 125, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/125", "skipped": false}, {"id": "PCN-012", "title": "All modals lack dialog semantics, focus management, and Escape handling", "severity": "High", "category": "Frontend", "type": "Issue", "sources": "FE-1", "location": "`src/components/modals/ScheduleModal.tsx`, `SessionDetailsModal.tsx`, `CancelModal.tsx`, `CalendarModal.tsx`, `ReviewChangesModal.tsx`", "description": "Verified — no `role=\"dialog\"` or `aria-modal` exists anywhere in `src/`. None of the five modals implement focus trapping, initial focus, focus restoration on close, or Escape-to-close; icon-only close buttons lack accessible labels. Keyboard and screen-reader users cannot reliably operate the booking, cancellation, or review flows — the core product interactions.", "recommendation": "Extract a shared `<Modal>` built on the native `<dialog>` element (free focus trap + Escape) or add `role=\"dialog\"`, `aria-modal=\"true\"`, labelled close buttons, and a focus trap; apply to all five modals.", "issue": 126, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/126", "skipped": false}, {"id": "PCN-013", "title": "Keyboard-inaccessible interactive elements (date tabs, avatars, logo)", "severity": "High", "category": "Frontend", "type": "Issue", "sources": "FE-8", "location": "`src/components/UpcomingSessions.tsx:857-868` (date tabs), `:944-955` (coach avatar/name); `src/components/Header.tsx:49` (logo)", "description": "Click handlers are attached to `div`/`img` elements with no `tabindex`, `role`, or key handling. The date-tab strip (primary navigation for booking), coach profile links, and the header logo are unusable by keyboard, violating WCAG 2.1.1. Combined with PCN-012 this makes the booking flow inaccessible end-to-end.", "recommendation": "Use `<button>` elements (date strip as a `role=\"tablist\"` with arrow-key handling); make avatar/name a link or button.", "issue": 127, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/127", "skipped": false}, {"id": "PCN-014", "title": "firebaseService.ts is a 933-line god module spanning seven domains", "severity": "High", "category": "Architecture", "type": "Issue", "sources": "ARCH-3", "location": "`src/services/firebaseService.ts` (933 lines)", "description": "Verified. One module mixes Firebase bootstrap/config, auth/session, profile CRUD, schedule management, slots-cache recalculation, support tickets, and coach discovery; `googleCalendar.ts` imports back into it, and domain types are exported from a module with import-time side effects (app initialization, config throw — see PCN-024). This coupling is a root enabler of other findings: duplicated slot generation (part of PCN-046's cleanup scope), components bypassing the layer (PCN-026), and the untestability of booking logic. The slot-generation algorithm is duplicated near-verbatim between `firebaseService.ts:532-564` and `googleCalendar.ts:530-561` (`generateFallbackAvailableSlots`), along with `chunkArray`; divergence would silently produce inconsistent bookable slots (verified both copies exist and are currently parallel).", "recommendation": "Split into `firebaseApp.ts` (bootstrap only), `authService`, `profileService`, `scheduleService`, `slotsService` (single shared slot-generation util used by both current copies), `supportService`, `discoveryService`; move shared types to a side-effect-free `types.ts`.", "issue": 128, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/128", "skipped": false}, {"id": "PCN-015", "title": "All bookings (incl. Meet links and topics) readable by any signed-in user", "severity": "Medium", "category": "Security", "type": "Vulnerability", "sources": "SEC-3", "location": "`firestore.rules:221-222`", "description": "Verified: `match /bookings/{bookingId} { allow read: if isSignedIn(); }`. Every authenticated account — including self-signed-up, never-approved accounts, since Google sign-in is open — can enumerate all bookings and read `googleMeetLink`, `topic`, participant UIDs, and times. This allows uninvited users to join others' coaching sessions and leaks potentially sensitive session topics. (Discovery's busy-slot merge reads the bookings collection client-side, which is why the rule is broad — a design constraint of the no-backend architecture, PCN-035.)", "recommendation": "Restrict booking reads to participants and admins. For discovery's busy-check, either accept the coarse-grained `availableSlotsCache` as the only public surface, or expose a minimal \"busy instants\" projection (no links/topics) via a separate collection or Cloud Function.", "issue": 129, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/129", "skipped": false}, {"id": "PCN-016", "title": "Fabricated fallback Google Meet links persisted to bookings", "severity": "Medium", "category": "Backend", "type": "Issue", "sources": "BE-7", "location": "`src/services/googleCalendar.ts:211-214` (random link), `:408` (`realMeetLink = data.hangoutLink || meetLink`), `:425-429` (persisted)", "description": "Verified. `scheduleMeeting` pre-generates a random `https://meet.google.com/xxx-xxxx-xxx` string. If the Google event is created but returns no `hangoutLink` (conference creation pending/failed), or when Google integration is disabled, this fabricated link is persisted as the booking's `googleMeetLink` and shown to both participants, who will join a dead (or worse, someone else's) meeting code at session time.", "recommendation": "Never fabricate Meet URLs. If `hangoutLink` is absent, store an empty link and surface \"link pending\" in the UI, retrying event fetch; treat a missing conference as a booking-flow error where appropriate.", "issue": 130, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/130", "skipped": false}, {"id": "PCN-017", "title": "meetLink rendered as unsanitized href in SessionDetailsModal", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE-9", "location": "`src/components/modals/SessionDetailsModal.tsx:68-88` (`href={meetLink}`); caller `src/components/UpcomingSessions.tsx:1139`", "description": "Verified. Every other render path passes stored links through `sanitizeMeetLink` (e.g. `ScheduleModal.tsx:194,207`), consistent with the project's own convention that Firestore data is client-written and must be protocol-checked (`url.ts:1-3`). SessionDetailsModal renders the raw value. Booking docs are writable by participants (and `googleMeetLink` is only type-checked by rules), so a malicious participant can store a `javascript:` or phishing URL that the counterparty clicks from this modal.", "recommendation": "Apply `sanitizeMeetLink` in SessionDetailsModal (one-line fix); consider enforcing the `meet.google.com` host in `isValidBookingDoc` as defense-in-depth.", "issue": 131, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/131", "skipped": false}, {"id": "PCN-018", "title": "Support ticket messages stored as one doc array with non-transactional read-modify-write", "severity": "Medium", "category": "Backend", "type": "Issue", "sources": "ARCH-12, BE-9", "location": "`src/services/firebaseService.ts:704-738` (`addMessageToSupportRequest`); `firestore.rules:317-326`", "description": "Verified. Replies are appended via `getDoc` → spread → `updateDoc` with no transaction. Concurrent replies (user and admin at once) lose messages: the rules' size-plus-one guard (`rules:320`) rejects the stale write outright (data loss surfaced as an error at best), and admin writes bypass that guard entirely (`isAdmin()` short-circuits), silently overwriting. Message IDs and `createdAt`/`updatedAt` come from the client clock (`:720,723,728,735`) and `updatedAt` drives `orderBy` in both list queries, so clock skew reorders tickets. The single-array design also grows toward the 1MB document cap with no pruning.", "recommendation": "Wrap the append in `runTransaction` (or better, move messages to a subcollection with `serverTimestamp()`), and use `serverTimestamp()` for `updatedAt`.", "issue": 132, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/132", "skipped": false}, {"id": "PCN-019", "title": "N+1 sequential profile reads in booking hydration (batched helper exists)", "severity": "Medium", "category": "Backend", "type": "Issue", "sources": "ARCH-6, BE-8", "location": "`src/services/googleCalendar.ts:125-185` (`getProfile` per booking, awaited serially in `processSnap`); duplicated pattern in `src/components/UserManagement.tsx:74-93` (per-coach booking queries + `getDoc` per uid)", "description": "Verified. `getUpcomingEvents` awaits one `getDoc` per coach and per client, per booking, sequentially inside a for-loop (memoized only within a single call). `UserManagement` repeats the pattern per user row. The batched `getProfiles` (chunked `documentId() in` queries, `firebaseService.ts:920-933`) already exists and is used elsewhere. Cost is latency (serial round-trips on the main sessions screen) and read billing.", "recommendation": "Collect all UIDs from both snapshots, call `getProfiles` once, then hydrate from the returned map; reuse in UserManagement.", "issue": 133, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/133", "skipped": false}, {"id": "PCN-020", "title": "Day-availability fetch race lets stale results overwrite newer selection", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE-7", "location": "`src/components/UpcomingSessions.tsx:242-276` (`loadDayAvailability`), `:288-295` (effect)", "description": "Verified. The effect's `active` flag is checked only before awaiting `handleRefresh`; `loadDayAvailability` unconditionally calls `setDayAvailability(availability)` and `setFetchedDayIndex(selectedDayIndex)` after its awaits, with no staleness check. Rapidly switching day tabs lets a slower earlier query resolve last and overwrite the newer day's results — the UI shows day A's coaches under day B's tab.", "recommendation": "Use a request-sequence counter or AbortController: capture the request's day index and discard results if a newer request has started.", "issue": 134, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/134", "skipped": false}, {"id": "PCN-021", "title": "Client clocks used for authoritative timestamps and cache expiry", "severity": "Medium", "category": "Backend", "type": "Warning", "sources": "BE-10", "location": "`src/services/firebaseService.ts:251` (profile `createdAt`), `:577` (cache `lastUpdated`), `:655,720,745` (support ISO strings); `src/services/googleCalendar.ts:296,337,497` (`Timestamp.now()`), `:330-338` (`expireAt` = slot start + 24h from client-parsed ISO)", "description": "Verified. `Timestamp.now()` and `new Date().toISOString()` (client clock) are used for `createdAt`, `cancelledAt`, cache freshness, and the `clientBookingCache` TTL `expireAt`. A skewed client clock corrupts ordering (support tickets order by client-written `updatedAt`), freshness checks, and lock expiry.", "recommendation": "Use `serverTimestamp()` for all audit/ordering fields; `expireAt` derived from `startIso` is acceptable but should be computed against server time semantics (slot start is trusted input, so this one is minor).", "issue": 135, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/135", "skipped": false}, {"id": "PCN-022", "title": "Firestore listeners without error callbacks die silently", "severity": "Medium", "category": "Backend", "type": "Warning", "sources": "BE-11", "location": "`src/services/firebaseService.ts:328-337` (`subscribeToProfile`), `:396-405` (`subscribeToAllUsers`), `:410-417` (`subscribeToActiveCoaches`), `:421-424` (`subscribeToPendingUsersCount`)", "description": "Verified. These four `onSnapshot` subscriptions pass no error observer; on a permission error or backend failure the listener terminates permanently and the UI silently freezes on stale data (profile, admin user list, pending-count badge). The booking subscriptions (`:608-620`, `:890-911`) show the correct pattern with error handlers.", "recommendation": "Add error callbacks that log/telemetry and set an error/retry state, matching the booking subscriptions.", "issue": 136, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/136", "skipped": false}, {"id": "PCN-023", "title": "Client-side HTML scraping of ICF credential site is fragile and likely CORS-blocked", "severity": "Medium", "category": "Backend", "type": "Warning", "sources": "BE-12", "location": "`src/services/icfService.ts:11-94`", "description": "The credential verification helper fetches and regex-parses HTML from `apps.coachingfederation.org` in the browser: the cross-origin fetch is likely CORS-blocked in production (errors swallowed at :90-93 and returned as `null`, indistinguishable from \"not found\"), the `tblResults` regex parsing breaks with any markup change, substring name matching produces false positives (\"Ann Lee\" matches \"Joanne Leeson\"), there is no timeout, and a fallback expiry date is invented (:71). Because this feeds admin credential verification (see PCN-003 for why that matters), unreliable results are a trust problem.", "recommendation": "Move verification into a Cloud Function (server-side fetch, no CORS), parse defensively, match names exactly/normalized, distinguish \"lookup failed\" from \"not found\", and never fabricate expiry dates.", "issue": 137, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/137", "skipped": false}, {"id": "PCN-024", "title": "No React error boundary; module-scope config throw white-screens the app", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "ARCH-11", "location": "`src/main.tsx:6-10`; `src/services/firebaseService.ts:136-145` (module-scope throw); `src/App.tsx:306-314`", "description": "Verified — no `ErrorBoundary`/`componentDidCatch` exists in `src/`. Any render-time error anywhere unmounts the whole tree to a blank page. Worse, the Firebase config guard throws at module import time (`import.meta.env.PROD` path), before React mounts, so a misconfigured production deployment renders a white screen with no user-facing message.", "recommendation": "Add a top-level error boundary with a fallback UI; convert the module-scope throw into a rendered \"configuration error\" screen (export a flag, branch in `main.tsx`).", "issue": 138, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/138", "skipped": false}, {"id": "PCN-025", "title": "No router; broken history behavior and no deep-linking", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "ARCH-10, FE-4", "location": "`src/App.tsx:35-58,281-297`; `src/utils/url.ts:38-53`", "description": "Verified. Navigation is a `useState` tab index; only `?profile=` is synced via hand-rolled `pushState` + synthetic `popstate` dispatch. Concrete bugs: `clearProfileFromUrl` uses `pushState` (`url.ts:50`), so pressing Back after closing a profile re-opens it (should be `replaceState` or `history.back()`); tabs are not represented in history or the URL at all, so Back/Forward skip them and no view except profiles is deep-linkable/shareable; `adminTabFilter` is prop-drilled to work around the missing router.", "recommendation": "Adopt react-router (routes per tab, `/profile/:uid`), which also gives navigation blocking for PCN-011; as a minimal fix, use `replaceState` in `clearProfileFromUrl` and encode the active tab in the URL.", "issue": 139, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/139", "skipped": false}, {"id": "PCN-026", "title": "Components bypass the service layer with raw Firestore queries", "severity": "Medium", "category": "Architecture", "type": "Issue", "sources": "ARCH-4", "location": "`src/components/UserManagement.tsx:23,74-93`; `src/components/SystemLogs.tsx:12,90-111`", "description": "Verified (UserManagement imports `collection/query/where/getDocs/getDoc` from `firebase/firestore` and queries bookings/users directly). Admin components construct their own Firestore queries instead of going through the service layer, duplicating collection names/shapes and the N+1 anti-pattern (PCN-019), and making the rules/service contract harder to evolve.", "recommendation": "Add `adminService` functions (e.g. `getUserBookingStats`, `getLogsPage`) and remove direct `firebase/firestore` imports from components; enforce with an ESLint `no-restricted-imports` rule scoped to `src/components`.", "issue": 140, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/140", "skipped": false}, {"id": "PCN-027", "title": "Unbounded collection reads without limits or pagination", "severity": "Medium", "category": "Architecture", "type": "Warning", "sources": "ARCH-7", "location": "`src/services/firebaseService.ts:396-405` (`subscribeToAllUsers`), `:695-702` (`getAllSupportRequests`)", "description": "Verified. Both read entire collections with no `limit()`; as users/tickets grow this degrades the admin dashboard and inflates read costs. `SystemLogs` demonstrates the correct paginated pattern in the same codebase.", "recommendation": "Add `limit()` + cursor pagination (`startAfter`) mirroring the SystemLogs implementation; for the users list, consider server-side search/filtering as the collection grows.", "issue": 141, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/141", "skipped": false}, {"id": "PCN-028", "title": "Dev deploy channel ships a development-mode bundle, disarming prod guards", "severity": "Medium", "category": "Architecture", "type": "Warning", "sources": "ARCH-9", "location": "`package.json:7-11` (`build` and `build:dev` both use `--mode development`); `.github/workflows/firebase-deploy.yml:40`", "description": "Verified. The development deploy job builds with `--mode development`, so the hosted dev-channel bundle is an unminified/dev-mode build and `import.meta.env.PROD` is false — which disarms the fail-fast config guard (`firebaseService.ts:140-144`, it only logs) on a deployed environment. Also note the default `build` script is dev-mode, an easy foot-gun.", "recommendation": "Build all deployed channels with `--mode production` (differentiating env vars, not mode); make plain `npm run build` production or remove it.", "issue": 142, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/142", "skipped": false}, {"id": "PCN-029", "title": "CI/CD gaps: no CI on push/PR, no environment protection, --debug deploys", "severity": "Medium", "category": "Backend", "type": "Warning", "sources": "BE-13", "location": "`.github/workflows/firebase-deploy.yml:3-13,56,101`; `Makefile:37,40`", "description": "Verified. The only workflow is `workflow_dispatch` deploy — lint/tests never run on push or PR, so broken code merges silently. The production job has no `environment:` protection rule (no approval gate). Both deploys pass `--debug` to the Firebase CLI, leaking verbose logs (project internals, potentially tokens) into CI output. The Makefile permits ad-hoc production deploys from a laptop, bypassing tests entirely.", "recommendation": "Add a CI workflow on push/PR (lint + test + build); add `environment: production` with required reviewers to the prod job; drop `--debug`; remove or gate the Makefile prod-deploy target.", "issue": 143, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/143", "skipped": false}, {"id": "PCN-030", "title": "No code splitting; admin-only code and 1,944-line timezone data eagerly bundled", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE-5", "location": "`src/App.tsx:2-19` (static imports); `src/components/UserManagement.tsx` (805 lines), `SystemLogs.tsx` (603), `AdminDashboard`; `src/config/timezones.ts` (1,944 lines)", "description": "Verified — no `React.lazy`/dynamic `import()` anywhere in `src/`. Every user downloads the admin dashboard, user management, system logs, and the full timezone table on first paint.", "recommendation": "`React.lazy` + `Suspense` for admin routes and modals; dynamic-import the timezone list where it's consumed.", "issue": 144, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/144", "skipped": false}, {"id": "PCN-031", "title": "Monolithic components with large inline style blocks and unscoped selectors", "severity": "Medium", "category": "Frontend", "type": "Warning", "sources": "FE-6", "location": "`src/components/UpcomingSessions.tsx` (1,170 lines; `<style>` block :423-659); `src/components/AvailabilityEdit.tsx:430-542`; `src/components/PublicProfile.tsx:292-298`", "description": "UpcomingSessions combines discovery, filtering, booking, session listing, and five modal integrations in one 1,170-line file with a 240-line inline `<style>` element whose selectors are global (collision risk across components rendering simultaneously). Same pattern in AvailabilityEdit and PublicProfile.", "recommendation": "Split UpcomingSessions into DayPicker/SlotGrid/FilterBar/SessionList; move styles to CSS modules or co-located `.css` files with scoped class names.", "issue": 145, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/145", "skipped": false}, {"id": "PCN-032", "title": "Inconsistent failure feedback: alert() vs silently swallowed errors", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE-10", "location": "`src/components/UpcomingSessions.tsx:1153-1155` (`alert()`); `src/components/MySessions.tsx:50-61,332-337` and `src/components/ProfileEdit.tsx:140-142` (console-only)", "description": "Verified for the alert path. Cancellation failure in UpcomingSessions uses a blocking `alert()`, while equivalent failures in MySessions and profile-save in ProfileEdit only `console.error` — the user gets no indication their action failed (compounding PCN-004's silent cache failures).", "recommendation": "Introduce one toast/notification primitive and use it for all user-initiated action failures; remove `alert()`.", "issue": 146, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/146", "skipped": false}, {"id": "PCN-033", "title": "Form controls without accessible names", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE-13", "location": "`src/components/AvailabilityEdit.tsx:613-631` (start/end time selects); `src/components/UpcomingSessions.tsx:674-698` (qualifications dropdown)", "description": "The availability start/end `<select>` elements have no associated `<label>`/`aria-label`, and the custom qualifications dropdown lacks `aria-expanded`, `aria-haspopup`, and label association — screen-reader users cannot tell what these controls set.", "recommendation": "Add `aria-label`s (or visually-hidden labels) to the selects; give the dropdown proper disclosure semantics (`button` + `aria-expanded` + `aria-controls`).", "issue": 147, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/147", "skipped": false}, {"id": "PCN-034", "title": "Zero component tests despite configured RTL/jsdom/vitest", "severity": "Medium", "category": "Frontend", "type": "Recommendation", "sources": "FE-14", "location": "test config in `vite.config.ts:29-37`; coverage `include` limited to utils/services/context/hooks/templates", "description": "Services, utils, and context have tests, but no component has any — the booking flow, onboarding wizard, and dirty-state integration (where PCN-010/011/020 live) are untested. jsdom + vitest are already configured; the coverage `include` list even excludes `src/components` from measurement, hiding the gap.", "recommendation": "Add React Testing Library tests for the booking modal flow, unsaved-changes navigation, and day-switch race; include `src/components` in coverage.", "issue": 148, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/148", "skipped": false}, {"id": "PCN-035", "title": "No server-side component: no cross-doc enforcement, notifications, or reaper jobs", "severity": "Medium", "category": "Architecture", "type": "Recommendation", "sources": "BE-16, ARCH-1 (partial)", "location": "repo-wide (no `functions/` directory); `firestore.rules:18-22` (acknowledging comment)", "description": "The app has no Cloud Functions or any trusted backend. Consequences verified throughout this review: rules cannot perform cross-document slot-conflict checks (the booking-ID pattern match at `rules:232` is the only structural guard), there is no reaper for orphaned pending bookings (PCN-001), no scheduled cache refresh (PCN-007), no server-side credential verification (PCN-023), admin checks require a per-request `get()` instead of custom claims, and bookings must be world-readable for discovery (PCN-015). No notifications exist beyond Google Calendar invites.", "recommendation": "Introduce a minimal Cloud Functions layer: a callable booking function, a daily scheduled cache-refresh/reaper, an ICF verification function, and an auth trigger to set an `admin` custom claim. This single investment structurally resolves or simplifies PCN-001, 004, 005, 006, 007, 015, and 023.", "issue": 149, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/149", "skipped": false}, {"id": "PCN-036", "title": "All user profiles including emails readable by any signed-in user", "severity": "Low", "category": "Security", "type": "Warning", "sources": "SEC-4", "location": "`firestore.rules:193-195`", "description": "Verified: `allow read: if isSignedIn()` on `users/{uid}`. Since sign-up is open, any Google account can enumerate all members' emails, names, countries, and bios — including pending users and admin accounts. Peer browsing needs active coaches only.", "recommendation": "Restrict full-profile reads to active users' profiles (or move public fields to a separate readable projection); at minimum exclude email from the readable surface.", "issue": 150, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/150", "skipped": false}, {"id": "PCN-037", "title": "clientBookingCache readable by any signed-in user leaks booking relationships", "severity": "Low", "category": "Security", "type": "Warning", "sources": "SEC-9", "location": "`firestore.rules:262-263`", "description": "Verified: `allow read: if isSignedIn()`. Documents contain `clientUid`, `coachUid`, `startIso` — who books whom and when. The lock check happens inside a transaction as the booking participant, so broad read access is unnecessary.", "recommendation": "Restrict reads to `resource.data.clientUid == request.auth.uid || resource.data.coachUid == request.auth.uid || isAdmin()`.", "issue": 151, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/151", "skipped": false}, {"id": "PCN-038", "title": "Booking create allows initiator to name an arbitrary counterparty", "severity": "Low", "category": "Security", "type": "Warning", "sources": "SEC-5", "location": "`firestore.rules:227-234`", "description": "Verified. Create requires only that the caller is one of `coachUid`/`clientUid`. A malicious user can create bookings naming any victim as the other party (griefing: squatting a coach's slots as fake client, or fabricating sessions \"as coach\" for an arbitrary client). The `clientBookingCache` self-lock only binds when the caller is the client.", "recommendation": "Hard to fully fix in rules alone (another argument for PCN-035); mitigations: require the named coach's cache to actually contain the slot (a rules `get()` on `availableSlotsCache`), and give users visibility/decline controls over bookings created in their name.", "issue": 152, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/152", "skipped": false}, {"id": "PCN-039", "title": "systemLogs create accepts unbounded details map from any signed-in user", "severity": "Low", "category": "Security", "type": "Recommendation", "sources": "SEC-6", "location": "`firestore.rules:283-292`", "description": "Verified: `event` is capped at 200 chars but `details` is only `is map` — any signed-in user can write near-1MB log documents at will (storage/cost abuse, admin log-view degradation). Reads/updates/deletes are correctly admin-only, and a TTL `expireAt` is required.", "recommendation": "Bound the `details` payload (e.g. validate known keys with `isValidString(..., 1000)` or cap `details.keys().size()`), and consider per-user rate limiting via a Cloud Function sink.", "issue": 153, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/153", "skipped": false}, {"id": "PCN-040", "title": ".env.development committed with live dev Firebase config; .gitignore lacks .env*", "severity": "Low", "category": "Security", "type": "Warning", "sources": "SEC-7", "location": "`/.env.development`, `/.env.emulator`; `.gitignore` (no `.env*` entry)", "description": "Verified — `.env.development` is committed and `.gitignore` contains no env exclusions. Firebase web config is public by design, but publishing it alongside the weak rules (PCN-002/003) and open self-signup lowers the bar for targeted abuse of the dev environment, and the missing `.gitignore` entry invites a future accidental commit of a genuinely secret env file. It also enables the PCN-009 fallback.", "recommendation": "Add `.env*` (allowing `.env.example`) to `.gitignore`; move real values to untracked files/CI variables (the CI already injects them).", "issue": 154, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/154", "skipped": false}, {"id": "PCN-041", "title": "Broader Google Calendar OAuth scope requested than needed", "severity": "Low", "category": "Security", "type": "Recommendation", "sources": "SEC-8", "location": "`src/services/firebaseService.ts:296-305` (scopes at :299-300)", "description": "Verified: login requests both `auth/calendar` (full calendar control, incl. calendar list/settings) and `auth/calendar.events`. All API calls in the codebase are event CRUD on the primary calendar, needing only `calendar.events`. Broader scope increases blast radius of token theft and worsens the consent screen.", "recommendation": "Remove the `auth/calendar` scope; keep `calendar.events` only.", "issue": 155, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/155", "skipped": false}, {"id": "PCN-042", "title": "Google Calendar fetch: silent truncation at 250 events and swallowed non-OK responses", "severity": "Low", "category": "Backend", "type": "Warning", "sources": "BE-14", "location": "`src/services/googleCalendar.ts:76-100`", "description": "Verified. The events request sets `timeMin` but no `timeMax` or `maxResults` and never follows `nextPageToken`; Google returns at most 250 items by default, silently truncating busy users' calendars so PCN's busy-overlay shows them free when they are not. Non-OK responses (including 401 token-expired) are silently ignored — the `if (response.ok)` has no else branch — so the user sees an empty calendar rather than a re-auth prompt.", "recommendation": "Add `timeMax` (booking horizon), `maxResults`, and pagination; on 401 surface `GOOGLE_TOKEN_EXPIRED` to trigger the re-auth flow (ties into PCN-008).", "issue": 156, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/156", "skipped": false}, {"id": "PCN-043", "title": "\"now\" frozen at mount causes stale upcoming/past classification", "severity": "Low", "category": "Frontend", "type": "Warning", "sources": "FE-11", "location": "`src/components/UpcomingSessions.tsx:67`; `src/components/MySessions.tsx:28,82-83`", "description": "The reference time used to classify sessions as upcoming vs past is captured once at mount. In a long-lived tab, sessions that end remain listed as upcoming/joinable; `useFocusRefresh` refetches data but does not refresh the frozen timestamp.", "recommendation": "Recompute `now` on each render or on focus-refresh (e.g. state updated in the refresh handler / a minute-interval tick).", "issue": 157, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/157", "skipped": false}, {"id": "PCN-044", "title": "Ineffective memoization and unmemoized AuthContext value", "severity": "Low", "category": "Frontend", "type": "Warning", "sources": "FE-12", "location": "`src/components/MySessions.tsx:82-133`; `src/context/AuthContext.tsx:115-127`", "description": "MySessions' `useMemo` filters depend on values recreated each render, so the memo recomputes every time (dead memoization). The AuthContext provider passes a fresh object literal as `value`, re-rendering every consumer on every provider render.", "recommendation": "Stabilize the memo dependencies; wrap the context value in `useMemo`.", "issue": 158, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/158", "skipped": false}, {"id": "PCN-045", "title": "Global window CustomEvent used for component communication", "severity": "Low", "category": "Frontend", "type": "Warning", "sources": "FE-16", "location": "`src/components/LeftNav.tsx:97-102` (dispatch); `src/components/SupportFeedback.tsx:66-68`, `src/components/SupportDesk.tsx:70-72` (listeners)", "description": "A window-level `'tab-reclick'` CustomEvent couples the nav to feature components invisibly — no type safety, unmockable in tests, leak-prone listeners, and behavior invisible in the component tree.", "recommendation": "Model \"re-click resets view\" via props/state — e.g. a reclick counter passed down, or a `key` change on the tab's root component.", "issue": 159, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/159", "skipped": false}, {"id": "PCN-046", "title": "Dead code: loggingService.ts, subscribeToBookings, CoachCard.tsx, unused assets", "severity": "Low", "category": "Architecture", "type": "Issue", "sources": "ARCH-13, BE-15, FE-15", "location": "`src/services/loggingService.ts` (imported only by its own test); `src/services/firebaseService.ts:608-620` (`subscribeToBookings`, unbounded, used only in tests); `src/components/CoachCard.tsx` (170 lines, never imported — verified); unused assets `hero.png`, `react.svg`, `vite.svg`", "description": "Verified. Two parallel telemetry implementations exist: `loggingService.ts` (never `initializeLogger`'d in app code, so its `logEvent` no-ops) duplicates `logger.telemetry`; only the latter is live. `subscribeToBookings` subscribes to all confirmed bookings with no bounds and has no production caller. `CoachCard.tsx` is referenced by no module. Dead parallel implementations invite future divergence (a maintainer may \"fix\" the dead one).", "recommendation": "Delete `loggingService.ts` (+ its test), `subscribeToBookings`, `CoachCard.tsx`, and unused assets; keep `logger.telemetry` as the single sink (and cache its `getFirestore` resolution).", "issue": 160, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/160", "skipped": false}, {"id": "PCN-047", "title": "Stale schema documentation and broken ERD generator", "severity": "Low", "category": "Architecture", "type": "Warning", "sources": "ARCH-14", "location": "`docs/schema-erd.md`; `scripts/generate-erd.js`", "description": "The documented schema describes `busySlotsCache` while the implementation uses `availableSlotsCache`, and omits `supportRequests` and `systemLogs`; the generator script produces the outdated model. Misleading docs are worse than none for onboarding and for reasoning about the rules surface.", "recommendation": "Regenerate/rewrite the ERD from the actual `COLLECTIONS` constants and rules file, or delete the doc until it can be maintained.", "issue": 161, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/161", "skipped": false}, {"id": "PCN-048", "title": "Unbounded, ever-growing subscribeToUserBookings snapshot listener", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE2-1", "location": "`src/services/firebaseService.ts:890-911`; consumed at `src/components/UpcomingSessions.tsx:217-221`", "description": "The dashboard listener queries `status == 'confirmed' AND (clientUid == uid OR coachUid == uid)` with no time bound and no `limit`. Because bookings only ever move between `pending|confirmed|cancelled` (`src/config/bookingTypes.ts:4-8`) and nothing demotes a past session out of `confirmed`, the subscribed result set grows monotonically for the life of the account, and the initial snapshot re-downloads the user's entire booking history on every Dashboard mount (i.e. every tab switch back to it). The one-shot path already bounds this correctly with `where('endTime', '>=', Timestamp.now())` (`googleCalendar.ts:119-120`).", "recommendation": "Add `where('endTime', '>=', Timestamp.now())` to the listener query (the UI only uses future slots for busy-marking), or add a `limit()` plus an index-backed time bound.", "issue": 162, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/162", "skipped": false}, {"id": "PCN-049", "title": "Day-tab/focus refetch triggers full Google Calendar + slots reload with a dead cancel guard", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE2-2", "location": "`src/components/UpcomingSessions.tsx:278-295` (also 223-240, 286)", "description": "`handleRefresh` (line 278) always runs all three loaders, and the effect at 288-295 depends on `handleRefresh`, whose identity changes whenever `activeDayDate`/`selectedDayIndex`/any filter changes. So every day-tab click or filter toggle re-runs not just `loadDayAvailability` but also `loadGoogleCalendarEvents` (full Google Calendar REST fetch + two Firestore booking queries + per-participant `getDoc`s) and `loadCurrentUserAvailableSlots`, none of whose inputs changed. `useFocusRefresh(handleRefresh)` (line 286) triggers the same triple fetch on every window focus. The `active` flag in the effect is checked only synchronously before the first `await` (line 291) and never gates result application, so it cancels nothing — including under StrictMode double-mount, where the whole triple fetch runs twice.", "recommendation": "Split into two effects — a mount/focus-scoped effect for `loadGoogleCalendarEvents` + `loadCurrentUserAvailableSlots`, and a day/filter-scoped effect for `loadDayAvailability` alone; make the guard effective by checking `active` after each `await` before calling setters (or thread an `AbortSignal`).", "issue": 163, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/163", "skipped": false}, {"id": "PCN-050", "title": "Coach-meetings fetch re-runs on every users snapshot with no cancellation", "severity": "Medium", "category": "Frontend", "type": "Issue", "sources": "FE2-3", "location": "`src/components/UserManagement.tsx:64-143` (deps at 143), fed by `subscribeToAllUsers` at 162-168", "description": "The effect that loads a selected coach's meeting history depends on `[selectedCoachUid, users]`, where `users` is a fresh array delivered by the live `subscribeToAllUsers` onSnapshot. While a coach detail panel is open, any write to any user document anywhere (someone editing their bio, an admin approving a user) re-triggers the entire fetch: two booking queries plus a sequential `getDoc` per participant (lines 74-133). There is no cancelled flag or abort, so if the admin switches `selectedCoachUid` quickly, a slow older fetch can resolve last and `setCoachMeetings` (line 136) with the previous coach's meetings under the new coach's panel.", "recommendation": "Depend on `selectedCoachUid` only (resolve the coach via a ref or a functional read of `users`), and add a `let cancelled = false` cleanup guard around `setCoachMeetings`.", "issue": 164, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/164", "skipped": false}, {"id": "PCN-051", "title": "UnsavedChangesContext retains stale isDirty/onSave closure after editor unmounts", "severity": "Medium", "category": "Frontend", "type": "Warning", "sources": "FE2-4", "location": "`src/context/UnsavedChangesContext.tsx:29-49`; consumers `ProfileEdit.tsx:148-158`, `AvailabilityEdit.tsx:389-417`, `UserManagement.tsx:254-286`", "description": "No consumer effect has a cleanup calling `setPageDirtyState(false, [], ...)`, and the provider never clears state on its own (`handleDiscard`/`handleConfirm` clear `isDirty` but never `onSave`). If a dirty editor unmounts via a path that skips confirmation (e.g. `navigateToProfile` avatar click swaps `main` to PublicProfile, `App.tsx:281`), the provider keeps `isDirty=true`, the change list, and the save closure over the dead component's state. The next tab click then shows an \"unsaved changes\" modal for a page that no longer exists, and \"Save & Continue\" executes the stale closure, writing outdated form data to Firestore; the closure (form state, profile, the `users` array in UserManagement's case) is retained in memory until another editor overwrites it. This is both a correctness bug and a memory-retention leak, and it compounds PCN-011.", "recommendation": "In each consumer, return `() => setPageDirtyState(false, [], async () => true)` from the dirty-tracking effect; also null out `onSave` in `handleDiscard`/`handleConfirm`.", "issue": 165, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/165", "skipped": false}, {"id": "PCN-052", "title": "Feedback setTimeouts never cleared (fire after unmount, overlap-clobber)", "severity": "Low", "category": "Frontend", "type": "Warning", "sources": "FE2-5", "location": "`SystemLogs.tsx:153`; `PublicProfile.tsx:59`; `VerificationNotice.tsx:88`; `AvailabilityEdit.tsx:261,270,276,376`; `ProfileEdit.tsx:138,246`", "description": "Nine \"clear this message after N seconds\" timers are created without storing/clearing the handle in any effect cleanup. They keep firing after the component unmounts (setState on an unmounted component — a silent no-op, but the closure is retained until the timer fires), and rapid repeat actions (e.g. two copy clicks within 2s in `SystemLogs.tsx:150-154`) let the first timer prematurely clear the second action's feedback.", "recommendation": "Store the timeout id in a ref, `clearTimeout` the previous one before setting a new one, and clear it in a `useEffect` unmount cleanup — or extract a small `useTransientMessage` hook.", "issue": 166, "issue_url": "https://github.com/premkumar-masilamani/peer-coaching-network/issues/166", "skipped": false}];
const SEV = ['Critical','High','Medium','Low'];
const SEVKEY = s=>'sev-'+s.toLowerCase();
const CATS = [...new Set(DATA.map(d=>d.category))].sort();
const state={q:'',sev:new Set(),cat:new Set(),sort:'sev',open:new Set()};

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(s){
  // code fences
  let parts = s.split(/```/);
  let out='';
  for(let i=0;i<parts.length;i++){
    if(i%2===1){ out+='<pre><code>'+esc(parts[i].replace(/^\n/,''))+'</code></pre>'; }
    else{
      let t=esc(parts[i]);
      t=t.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
      t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
      t=t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
      out+=t;
    }
  }
  return out;
}
function hl(html,q){
  if(!q) return html;
  try{const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'));}
  catch(e){return html;}
}
const sevCount=s=>DATA.filter(d=>d.severity===s).length;

function renderTop(){
  const total=DATA.length;
  document.getElementById('stats').innerHTML =
    `<div class="stat total"><div class="n">${total}</div><div class="l">Findings</div><div class="bar"></div></div>`+
    SEV.map(s=>`<div class="stat ${s.toLowerCase()==='critical'?'crit':s.toLowerCase()==='high'?'high':s.toLowerCase()==='medium'?'med':'low'}">
      <div class="n">${sevCount(s)}</div><div class="l">${s}</div><div class="bar"></div></div>`).join('');
  const colors={Critical:'var(--crit)',High:'var(--high)',Medium:'var(--med)',Low:'var(--low)'};
  document.getElementById('distrib').innerHTML = SEV.map(s=>
    `<span title="${s}: ${sevCount(s)}" style="width:${sevCount(s)/total*100}%;background:${colors[s]}"></span>`).join('');
  document.getElementById('sevchips').innerHTML = SEV.map(s=>{
    const c={Critical:'var(--crit)',High:'var(--high)',Medium:'var(--med)',Low:'var(--low)'}[s];
    return `<div class="chip ${SEVKEY(s)}" data-sev="${s}"><span class="dot" style="background:${c}"></span>${s} <span style="opacity:.7">${sevCount(s)}</span></div>`;
  }).join('');
  document.getElementById('catchips').innerHTML = CATS.map(c=>
    `<div class="chip cat" data-cat="${c}">${c} <span style="opacity:.7">${DATA.filter(d=>d.category===c).length}</span></div>`).join('');
}

function match(d){
  if(state.sev.size && !state.sev.has(d.severity)) return false;
  if(state.cat.size && !state.cat.has(d.category)) return false;
  if(state.q){
    const h=(d.id+' '+d.title+' '+d.location+' '+d.description+' '+d.recommendation+' '+d.sources).toLowerCase();
    if(!h.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
function render(){
  const rank={Critical:0,High:1,Medium:2,Low:3};
  let rows=DATA.filter(match);
  rows.sort((a,b)=> state.sort==='id'? a.id.localeCompare(b.id)
    : state.sort==='cat'? (a.category.localeCompare(b.category)|| rank[a.severity]-rank[b.severity])
    : (rank[a.severity]-rank[b.severity] || a.id.localeCompare(b.id)));
  const q=state.q;
  document.getElementById('cnt').textContent = `Showing ${rows.length} of ${DATA.length} findings`;
  const list=document.getElementById('list');
  if(!rows.length){ list.innerHTML='<div class="empty">No findings match your filters.</div>'; return; }
  list.innerHTML = rows.map(d=>{
    const op=state.open.has(d.id)?'open':'';
    const skip=d.skipped?`<span class="b skip">duplicate → #110</span>`:'';
    const ilink = d.skipped
      ? `<a class="ilink" href="${d.issue_url}" target="_blank">↗ Existing issue #${d.issue} (duplicate)</a>`
      : `<a class="ilink" href="${d.issue_url}" target="_blank">↗ GitHub issue #${d.issue}</a>`;
    return `<div class="card ${SEVKEY(d.severity)} ${op}" data-id="${d.id}">
      <div class="chead" onclick="toggle('${d.id}')">
        <div class="chev">▶</div>
        <div class="idb">${d.id}</div>
        <div>
          <div class="ttl">${hl(esc(d.title),q)}</div>
          <div class="badges">
            <span class="b ${SEVKEY(d.severity)}">${d.severity}</span>
            <span class="b cat">${d.category}</span>
            <span class="b type">${d.type}</span>
            ${skip}
          </div>
        </div>
      </div>
      <div class="cbody">
        <h4>Location</h4><div class="loc">${hl(md(d.location),q)}</div>
        <h4>Description</h4><div>${hl(md(d.description),q)}</div>
        <h4>Recommendation</h4><div class="rec">${hl(md(d.recommendation),q)}</div>
        <div class="srcs">Merged from: ${esc(d.sources)}</div>
        ${ilink}
      </div>
    </div>`;
  }).join('');
}
function toggle(id){ state.open.has(id)?state.open.delete(id):state.open.add(id); render(); }

document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render();});
document.getElementById('sort').addEventListener('change',e=>{state.sort=e.target.value;render();});
document.getElementById('expand').onclick=()=>{DATA.filter(match).forEach(d=>state.open.add(d.id));render();};
document.getElementById('collapse').onclick=()=>{state.open.clear();render();};
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-sev]'); const c=e.target.closest('[data-cat]');
  if(s){const v=s.dataset.sev; state.sev.has(v)?state.sev.delete(v):state.sev.add(v); s.classList.toggle('on'); render();}
  if(c){const v=c.dataset.cat; state.cat.has(v)?state.cat.delete(v):state.cat.add(v); c.classList.toggle('on'); render();}
});
renderTop(); render();
</script>
</body></html>
