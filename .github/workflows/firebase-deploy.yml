name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - production

jobs:
  deploy-dev:
    name: Build & Deploy (Development)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment == 'development' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Web Application (Development)
        run: npm run build:dev
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.DEV_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.DEV_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.DEV_VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ vars.DEV_VITE_FIRESTORE_DATABASE_ID }}
          VITE_USE_FIREBASE_EMULATOR: false
          VITE_LOG_LEVEL: ${{ vars.DEV_VITE_LOG_LEVEL }}

      - name: Deploy to Firebase (Development)
        uses: w9jds/firebase-action@v15.22.4
        with:
          args: deploy --only firestore:${{ vars.DEV_VITE_FIRESTORE_DATABASE_ID }},hosting --project ${{ vars.DEV_VITE_FIREBASE_PROJECT_ID }} --debug
        env:
          GCP_SA_KEY: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT }}

  deploy-prod:
    name: Build & Deploy (Production)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment == 'production' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Web Application (Production)
        run: npm run build:prod
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.PROD_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.PROD_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.PROD_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PROD_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.PROD_VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.PROD_VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ vars.PROD_VITE_FIRESTORE_DATABASE_ID }}
          VITE_USE_FIREBASE_EMULATOR: false
          VITE_LOG_LEVEL: ${{ vars.PROD_VITE_LOG_LEVEL }}

      - name: Deploy to Firebase (Production)
        uses: w9jds/firebase-action@v15.22.4
        with:
          args: deploy --only firestore:${{ vars.PROD_VITE_FIRESTORE_DATABASE_ID }},hosting --project ${{ vars.PROD_VITE_FIREBASE_PROJECT_ID }} --debug
        env:
          GCP_SA_KEY: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT }}
