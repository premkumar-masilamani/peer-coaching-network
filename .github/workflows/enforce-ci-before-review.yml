name: Enforce CI Before Review

# Triggers when someone clicks "Ready for review" on a draft PR.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  pull-requests: write   # needed to convert back to draft and post a comment
  checks: read           # needed to read the CI status checks

jobs:
  enforce:
    name: Block review until CI passes
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status and revert to draft if not passed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha  = context.payload.pull_request.head.sha;
            const prNo = context.payload.pull_request.number;
            const prId = context.payload.pull_request.node_id;

            // Fetch the latest run of the "CI Passed" gate job for this SHA.
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   sha,
              check_name: 'CI Passed',
              filter: 'latest',
              per_page: 1,
            });

            const latestRun = checks.check_runs[0];
            const passed    = latestRun?.conclusion === 'success';

            if (passed) {
              core.info('CI Passed ✅ — PR may proceed to review.');
              return;
            }

            const status = latestRun
              ? `status is \`${latestRun.status}\`, conclusion is \`${latestRun.conclusion ?? 'pending'}\``
              : 'no CI run found for this commit';

            // Convert the PR back to draft via the GraphQL API.
            await github.graphql(`
              mutation ConvertToDraft($prId: ID!) {
                convertPullRequestToDraft(input: { pullRequestId: $prId }) {
                  pullRequest { isDraft }
                }
              }
            `, { prId });

            // Leave a comment explaining why.
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: prNo,
              body: [
                '## ⏳ PR moved back to Draft — CI has not passed yet',
                '',
                `The **CI Passed** check must succeed before this PR can be marked ready for review (${status}).`,
                '',
                '**Required checks:**',
                '- Lint',
                '- Unit Tests',
                '- Integration & Performance Tests',
                '',
                'Once all checks are green, mark the PR as **Ready for review** again.',
              ].join('\n'),
            });

            core.setFailed(
              `PR reverted to draft: CI has not passed for ${sha}. ${status}.`
            );
